
name: Render cinematic video

on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      topic:
        required: true
        type: string
      language:
        required: true
        type: choice
        options: [en, hi, mr]
      format:
        required: true
        type: choice
        options: [short, long]
      minutes:
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg, fonts and Python libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core
          python3 -m pip install --upgrade pip
          python3 -m pip install requests edge-tts pillow

      - name: Generate script, voice, scenes and video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WORKER_API_URL: ${{ secrets.WORKER_API_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
          TOPIC: ${{ inputs.topic }}
          LANGUAGE: ${{ inputs.language }}
          FORMAT: ${{ inputs.format }}
          MINUTES: ${{ inputs.minutes }}
        run: python3 render.py

      - name: Mark render failed
        if: failure()
        env:
          WORKER_API_URL: ${{ secrets.WORKER_API_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          curl -sS -X POST "$WORKER_API_URL/api/jobs/$JOB_ID/failed" \
            -H "Authorization: Bearer $APP_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"error":"GitHub render workflow failed. Inspect the Actions log and retry."}' || true
